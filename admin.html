<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar invitaciones</title><style>:root{--rose:#a86f76;--gold:#b58a3b;--olive:#4d5b35;--paper:#fffaf0;--ink:#313126}*{box-sizing:border-box}body{margin:0;padding:24px;background:#eee6d8;color:var(--ink);font-family:Arial,sans-serif}.box{max-width:700px;margin:5vh auto;padding:34px;background:var(--paper);border:1px solid #c9ad7a;box-shadow:0 18px 50px #4c3f2b24}h1,h2{font-family:Georgia,serif;color:#2f3a22;font-weight:400}h1{margin:4px 0 28px}.k{color:var(--rose);font-size:.75rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase}label{display:block;margin:18px 0 6px;color:#2f3a22;font-weight:700;font-size:.86rem}input{width:100%;padding:14px;border:1px solid #cfc4a9;border-radius:4px;background:white;font-size:1rem}button,.button{display:inline-block;margin-top:18px;padding:14px 20px;border:0;border-radius:4px;background:linear-gradient(135deg,var(--rose),#87565d);color:#fff;cursor:pointer;font-weight:700;text-decoration:none}.secondary{background:var(--olive)}#panel,#result{display:none}#result{margin-top:24px;padding:20px;background:#ead6d3;border-radius:6px}#url{font-size:.85rem}.actions{display:flex;flex-wrap:wrap;gap:10px}.error{color:#962f35;font-weight:700}.help{line-height:1.55;color:#655c52;font-size:.92rem}</style></head><body><main class="box"><p class="k">Boda de Yohanna &amp; Yeiskender</p><h1>Invitaciones personales</h1><section id="login"><label for="pin">Código de acceso</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password"><button id="enter">Entrar</button><p class="error" id="error"></p></section><section id="panel"><h2>Crear enlace</h2><p class="help">Escribe a quién va dirigida la invitación y cuántas personas puede incluir. Luego copia el enlace y envíalo por WhatsApp.</p><label for="name">Familia o invitado</label><input id="name" placeholder="Ej. Familia González"><label for="count">Número de pases</label><input id="count" type="number" min="1" max="20" value="2"><button id="create">Crear enlace personal</button><div id="result"><strong>Enlace listo</strong><input id="url" readonly><div class="actions"><button id="copy">Copiar enlace</button><a class="button secondary" id="preview" target="_blank" rel="noopener">Ver invitación</a></div><p id="copied"></p></div><hr style="margin:34px 0;border:0;border-top:1px solid #d7cbb2"><a class="button secondary" href="https://docs.google.com/forms/d/1VT0AcK_NXY2h7RyhPkQJT7AggPaHo0G6t5BJrbFq-QE/edit?pli=1" target="_blank" rel="noopener">Ver confirmaciones</a></section></main><script>const $=id=>document.getElementById(id);function unlock(){if($('pin').value==='230591'){sessionStorage.setItem('boda-admin','1');$('login').style.display='none';$('panel').style.display='block'}else $('error').textContent='Código incorrecto.'}$('enter').onclick=unlock;$('pin').onkeydown=e=>{if(e.key==='Enter')unlock()};if(sessionStorage.getItem('boda-admin')==='1')unlock();$('create').onclick=()=>{const n=$('name').value.trim(),p=Math.max(1,Math.min(20,Number($('count').value)||1));if(!n)return alert('Escribe el nombre de la familia o invitado.');const base=new URL('index.html',location.href);base.searchParams.set('invitado',n);base.searchParams.set('pases',p);$('url').value=base.href;$('preview').href=base.href;$('result').style.display='block';$('copied').textContent=''};$('copy').onclick=async()=>{await navigator.clipboard.writeText($('url').value);$('copied').textContent='Enlace copiado. Ya puedes enviarlo.'}</script></body></html>
